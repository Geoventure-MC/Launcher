<div class="instances-content">
    <div class="instances-header">
        <div class="instances-logo">
            <img src="../src/assets/images/logo/logo.png" alt="Nexus" class="logo-img">
            <div class="logo-text">NEXUS</div>
        </div>
        <div class="instances-subtitle" id="instances-subtitle">Choisis ton aventure</div>
        <div class="instances-channel-switch" id="instances-channel-switch" role="group" aria-label="Branche d'instance">
            <button type="button" class="instances-channel-btn active" data-channel="stable" id="instances-channel-stable">
                <span class="channel-dot stable"></span>
                <span class="channel-label">Instance Stable</span>
            </button>
            <button type="button" class="instances-channel-btn" data-channel="test" id="instances-channel-test">
                <span class="channel-dot test"></span>
                <span class="channel-label">Instance Test</span>
                <span class="channel-role-badge" id="instances-test-badge"></span>
            </button>
        </div>
    </div>

    <div class="instances-grid" id="instances-grid"></div>

    <div class="instances-footer">
        <button class="instances-settings-btn" id="instances-settings-btn" title="Paramètres">
            <i class="icon-settings"></i>
        </button>
        <div class="instances-version" id="instances-version"></div>
    </div>
</div>
