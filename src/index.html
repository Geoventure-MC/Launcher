<html>
    <head>
        <meta charset="UTF-8">
        <!-- CSP : aucun script en ligne ni gestionnaire on*="…" (une annonce piégée ne peut rien exécuter). 'unsafe-eval' reste pour le code obfusqué du build. -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: blob: file: https: http:; media-src 'self' blob: file: https: http:; connect-src 'self' https: http: ws: wss:; frame-src https: http:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
        <link rel="stylesheet" href="assets/css/index.css">
    </head>
    <body>
        <div id="splash" style="display:none">
            <img class="splash" src="assets/images/icon.png" />
            <p class="splash-message" id="splash-message"></p>
            <p class="splash-author"><span class="author" id="splash-author"></span></p>
            <p class="message" id="update-message"></p>
            <progress value="0" max="0"></progress>
        </div>
        <script src="assets/js/index.js" type="module"></script>
    </body>
</html>
