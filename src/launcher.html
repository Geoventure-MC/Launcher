<html>
    <head>
        <meta charset="UTF-8">
        <!-- CSP : aucun script en ligne ni gestionnaire on*="…" (une annonce piégée ne peut rien exécuter). 'unsafe-eval' reste pour le code obfusqué du build. -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https:; font-src 'self' data: https:; img-src 'self' data: blob: file: https: http:; media-src 'self' blob: file: https: http:; connect-src 'self' https: http: ws: wss:; frame-src https: http:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
        <link rel="stylesheet" href="assets/css/launcher.css">
    </head>
    <body class="hide">
        <div class="dragbar"></div>
        <div class="frame">
            <div id="minimize" class="button-frame icon-minimize"></div>
            <div id="maximize" class="button-frame icon-maximize"></div>
            <div id="close" class="button-frame icon-close"></div>
        </div>

        <div class="preload-content">
            <div class="preload-progress">
                <span class="dot"></span>
                <div class="dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
            <div class="preload-title" id="preload-title"></div>
        </div>

        <div class="panels"></div>
        <script src="assets/js/launcher.js" type="module"></script>
    </body>
</html>
